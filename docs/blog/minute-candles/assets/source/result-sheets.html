<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080, initial-scale=1">
  <title>분봉 블로그 결과표</title>
  <style>
    :root {
      --paper: #fcfbf7;
      --ink: #0f172a;
      --slate: #475569;
      --muted: #64748b;
      --blue: #2563eb;
      --blue-soft: #dbeafe;
      --green: #059669;
      --green-soft: #d1fae5;
      --yellow: #b45309;
      --yellow-soft: rgba(245, 158, 11, 0.2);
      --rule: rgba(15, 23, 42, 0.36);
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 1080px;
      height: 1350px;
      margin: 0;
      overflow: hidden;
      color: var(--ink);
      background: var(--paper);
      font-family: Pretendard, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      font-variant-numeric: tabular-nums;
      -webkit-font-smoothing: antialiased;
    }

    .sheet {
      position: relative;
      width: 1080px;
      height: 1350px;
      padding: 100px 76px 96px;
      background:
        linear-gradient(rgba(252, 251, 247, 0.08), rgba(252, 251, 247, 0.08)),
        url("result-paper-background.png") center / cover no-repeat;
      overflow: hidden;
    }

    .sheet::before,
    .sheet::after {
      content: "";
      position: absolute;
      width: 34px;
      height: 34px;
      top: 30px;
      border-top: 3px solid rgba(15, 23, 42, 0.72);
      pointer-events: none;
    }

    .sheet::before {
      left: 30px;
      border-left: 3px solid rgba(15, 23, 42, 0.72);
      transform: rotate(-1deg);
    }

    .sheet::after {
      right: 30px;
      border-right: 3px solid rgba(15, 23, 42, 0.72);
      transform: rotate(1deg);
    }

    .content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .topline {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 24px;
      margin: 0 0 8px;
    }

    .kicker,
    .status-note {
      font-size: 34px;
      line-height: 1.2;
      font-weight: 800;
    }

    .kicker {
      color: var(--blue);
      font-family: "D2Coding ligature", "D2Coding", monospace;
      letter-spacing: 0.02em;
    }

    .status-note {
      position: relative;
      flex: none;
      color: var(--green);
      text-align: right;
      transform: rotate(-1deg);
    }

    .status-note::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: -8px;
      border-bottom: 4px solid var(--green);
      border-radius: 50%;
      transform: rotate(0.8deg);
    }

    h1 {
      margin: 0;
      font-size: 58px;
      line-height: 1.12;
      letter-spacing: -0.04em;
      font-weight: 850;
    }

    .blue-rule {
      width: 520px;
      height: 13px;
      margin: 7px 0 0;
      border-bottom: 5px solid var(--blue);
      border-radius: 50%;
      transform: rotate(-0.35deg);
    }

    .subtitle {
      margin: 10px 0 0;
      color: var(--slate);
      font-size: 34px;
      line-height: 1.35;
      font-weight: 600;
    }

    .header-divider {
      margin: 14px 0 0;
      border-bottom: 4px solid var(--ink);
      transform: rotate(-0.08deg);
    }

    .section-title {
      display: inline-block;
      position: relative;
      margin: 0 0 10px;
      font-size: 40px;
      line-height: 1.2;
      font-weight: 850;
    }

    .section-title::after {
      content: "";
      position: absolute;
      left: -3px;
      right: -12px;
      bottom: -4px;
      height: 13px;
      background: var(--blue-soft);
      border-radius: 50%;
      transform: rotate(-0.7deg);
      z-index: -1;
    }

    .mono { font-family: "D2Coding ligature", "D2Coding", monospace; }
    .green { color: var(--green); }
    .blue { color: var(--blue); }
    .yellow { color: var(--yellow); }

    .flow {
      display: grid;
      grid-template-columns: 1fr 42px 1.35fr 42px 1fr;
      align-items: center;
      gap: 4px;
      margin: 12px 4px;
      text-align: center;
    }

    .flow-node {
      position: relative;
      padding: 8px 4px 11px;
      border-bottom: 4px solid var(--ink);
      font-size: 34px;
      line-height: 1.28;
      font-weight: 780;
    }

    .flow-node::after {
      content: "";
      position: absolute;
      left: 8%;
      right: 4%;
      bottom: -9px;
      border-bottom: 2px solid rgba(15, 23, 42, 0.52);
      transform: rotate(0.7deg);
    }

    .flow-arrow {
      color: var(--blue);
      font-size: 47px;
      font-weight: 850;
      transform: rotate(-1deg);
    }

    .result-table {
      width: 100%;
      border-collapse: collapse;
      border-top: 4px solid var(--ink);
      border-bottom: 4px solid var(--ink);
      background: rgba(255, 255, 255, 0.26);
    }

    .result-table th,
    .result-table td {
      padding: 9px 12px;
      border-bottom: 2px solid var(--rule);
      font-size: 34px;
      line-height: 1.22;
      vertical-align: middle;
    }

    .result-table tr:last-child th,
    .result-table tr:last-child td { border-bottom: 0; }

    .result-table th {
      width: 57%;
      color: var(--slate);
      text-align: left;
      font-weight: 650;
    }

    .result-table td {
      text-align: right;
      font-weight: 830;
    }

    .evidence-block {
      margin-top: 14px;
      padding: 14px 20px 13px;
      border-top: 4px solid var(--ink);
      border-bottom: 4px solid var(--ink);
      background: rgba(255, 255, 255, 0.24);
    }

    .formula {
      font-size: 38px;
      line-height: 1.28;
      font-weight: 780;
    }

    .formula strong {
      color: var(--green);
      font-size: 45px;
      font-weight: 880;
    }

    .recovery {
      margin-top: 6px;
      color: var(--slate);
      font-size: 34px;
      line-height: 1.28;
      font-weight: 650;
    }

    .wide-note {
      margin-top: 12px;
      padding: 10px 16px;
      border-top: 3px solid var(--ink);
      border-bottom: 3px solid var(--ink);
      background: linear-gradient(transparent 34%, var(--yellow-soft) 34%, var(--yellow-soft) 84%, transparent 84%);
      font-size: 34px;
      line-height: 1.3;
      font-weight: 680;
    }

    .scope-note {
      margin-top: auto;
      padding: 10px 6px 0;
      border-top: 3px solid var(--ink);
      color: var(--slate);
      font-size: 34px;
      line-height: 1.28;
      font-weight: 600;
    }

    .bands {
      margin-top: 14px;
      border-top: 4px solid var(--ink);
      border-bottom: 4px solid var(--ink);
      background: rgba(255, 255, 255, 0.24);
    }

    .band {
      padding: 14px 20px 13px;
      border-bottom: 3px solid var(--rule);
    }

    .band:last-child { border-bottom: 0; }

    .band-title {
      display: inline-block;
      margin-bottom: 4px;
      color: var(--blue);
      font-size: 42px;
      line-height: 1.15;
      font-weight: 880;
      transform: rotate(-0.4deg);
    }

    .metric-lead {
      margin-bottom: 5px;
      font-size: 46px;
      line-height: 1.2;
      font-weight: 880;
    }

    .metric-line {
      font-size: 34px;
      line-height: 1.28;
      font-weight: 650;
    }

    .compression-row + .compression-row { margin-top: 12px; }

    .compression-value {
      margin-bottom: 5px;
      font-size: 35px;
      line-height: 1.22;
      font-weight: 750;
    }

    .bar-pair {
      display: grid;
      grid-template-columns: 1fr 46px 1fr;
      align-items: center;
      gap: 8px;
    }

    .bar-track {
      height: 22px;
      overflow: hidden;
      border: 3px solid var(--ink);
      border-radius: 12px 15px 11px 14px;
      background: rgba(100, 116, 139, 0.14);
    }

    .bar-fill { height: 100%; background: var(--blue); }
    .bar-fill.raw { width: 100%; background: #94a3b8; }
    .bar-fill.day1 { width: 9.1%; }
    .bar-fill.day5 { width: 8.6%; }

    .bar-arrow {
      color: var(--blue);
      text-align: center;
      font-size: 38px;
      font-weight: 850;
    }

    .load-table {
      margin-top: 14px;
      border-top: 4px solid var(--ink);
      border-bottom: 4px solid var(--ink);
      background: rgba(255, 255, 255, 0.24);
    }

    .load-grid {
      display: grid;
      grid-template-columns: 1.55fr 1fr 1fr 1.25fr 0.7fr;
      align-items: center;
      column-gap: 10px;
    }

    .load-head {
      padding: 9px 12px;
      border-bottom: 3px solid var(--ink);
      color: var(--slate);
      font-size: 34px;
      line-height: 1.25;
      font-weight: 780;
    }

    .load-row {
      min-height: 88px;
      padding: 8px 12px;
      border-bottom: 2px solid var(--rule);
      font-size: 34px;
      line-height: 1.18;
      font-weight: 680;
    }

    .load-row:last-child { border-bottom: 0; }
    .load-grid > :not(:first-child) { text-align: right; }
    .load-row .p95 { color: var(--green); font-weight: 850; }
    .load-row .p95.fail { color: var(--yellow); }

    .status-note.warning { color: var(--yellow); }
    .status-note.warning::after { border-bottom-color: var(--yellow); }

    .observation {
      margin-top: 12px;
      padding: 11px 15px;
      border-left: 6px solid var(--yellow);
      background: var(--yellow-soft);
      font-size: 34px;
      line-height: 1.27;
      font-weight: 680;
    }

    .test-equation {
      margin: 14px 0 12px;
      padding: 12px 14px;
      border-top: 4px solid var(--ink);
      border-bottom: 4px solid var(--ink);
      text-align: center;
      font-size: 34px;
      line-height: 1.25;
      font-weight: 780;
      background: rgba(255, 255, 255, 0.24);
    }

    .test-counts {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      align-items: end;
      margin-bottom: 8px;
    }

    .test-counts span {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .test-equation strong {
      color: var(--blue);
      font-size: 48px;
      font-weight: 900;
    }

    .test-equation .total { color: var(--green); }

    .quality-list {
      margin: 0;
      padding: 0;
      list-style: none;
      border-top: 4px solid var(--ink);
      border-bottom: 4px solid var(--ink);
      background: rgba(255, 255, 255, 0.22);
    }

    .quality-list li {
      padding: 8px 13px;
      border-bottom: 2px solid var(--rule);
      font-size: 34px;
      line-height: 1.22;
      font-weight: 670;
    }

    .quality-list li:last-child { border-bottom: 0; }

    .tests .scope-note,
    .load .scope-note { font-size: 34px; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    const sheets = {
      api: `
        <article class="sheet api"><div class="content">

              <div class="metric-line"><span class="green">20,337,922체결/초</span> · 가장 느린 회차 19,964,397체결/초</div>

              <div class="band-title">gzip</div>

                <div class="compression-value">1일 · 56,658B → 5,177B · <span class="green">90.9% 감소</span></div>

      tests: `
